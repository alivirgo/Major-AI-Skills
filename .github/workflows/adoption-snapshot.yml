name: Adoption snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/scripts/adoption_snapshot.js > adoption.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adoption-${{ github.run_id }}
          path: adoption.json
          retention-days: 90
