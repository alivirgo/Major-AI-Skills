name: Update download graphs

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-graphs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node tools/scripts/update_download_graph.js
      - name: Commit updated graphs
        shell: bash
        run: |
          if git diff --quiet -- assets/npm-downloads.svg assets/jsdelivr-downloads.svg; then
            echo "Download graphs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/npm-downloads.svg assets/jsdelivr-downloads.svg
          git commit -m "chore: update npm and jsdelivr download graphs"
          git push
