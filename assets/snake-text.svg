<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" role="img" aria-label="Major AI Skills interactive snake text animation">
  <defs>
    <!-- Background & Terminal Gradients -->
    <linearGradient id="term-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d13"/>
      <stop offset="100%" stop-color="#111822"/>
    </linearGradient>

    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161f2c"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <!-- Snake Gradients -->
    <linearGradient id="snake-head-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58ff9b"/>
      <stop offset="100%" stop-color="#00d8ff"/>
    </linearGradient>

    <linearGradient id="snake-body-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Typography & Syntax Colors */
    .mono-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      fill: #e6edf3;
    }
    .text-dim { fill: #8b949e; }
    .text-cyan { fill: #58a6ff; font-weight: 600; }
    .text-green { fill: #3fb950; font-weight: 600; }
    .text-purple { fill: #bc8cff; font-weight: 600; }
    .text-orange { fill: #f0883e; font-weight: 600; }
    .text-red { fill: #f85149; font-weight: 600; }
    .text-yellow { fill: #d29922; font-weight: 600; }

    /* 100% Pure CSS Hardware-Accelerated Snake Motion (8s loop) */
    @keyframes snake-crawl {
      0.0% { transform: translate(-60.0px, 118.0px) rotate(0.0deg); }
      2.5% { transform: translate(-18.5px, 116.6px) rotate(-4.1deg); }
      5.0% { transform: translate(16.9px, 112.8px) rotate(-8.0deg); }
      7.5% { transform: translate(47.6px, 107.6px) rotate(-11.4deg); }
      10.0% { transform: translate(75.0px, 101.5px) rotate(-13.3deg); }
      12.5% { transform: translate(100.5px, 95.4px) rotate(-13.0deg); }
      15.0% { transform: translate(125.6px, 90.2px) rotate(-10.4deg); }
      17.5% { transform: translate(151.6px, 86.4px) rotate(-5.7deg); }
      20.0% { transform: translate(180.0px, 85.0px) rotate(0.0deg); }
      22.5% { transform: translate(207.7px, 87.7px) rotate(11.4deg); }
      25.0% { transform: translate(231.6px, 94.8px) rotate(21.5deg); }
      27.5% { transform: translate(253.1px, 104.9px) rotate(28.0deg); }
      30.0% { transform: translate(273.8px, 116.5px) rotate(29.8deg); }
      32.5% { transform: translate(294.8px, 128.1px) rotate(26.9deg); }
      35.0% { transform: translate(317.8px, 138.2px) rotate(20.0deg); }
      37.5% { transform: translate(344.1px, 145.3px) rotate(10.3deg); }
      40.0% { transform: translate(375.0px, 148.0px) rotate(0.0deg); }
      42.5% { transform: translate(403.1px, 145.7px) rotate(-9.4deg); }
      45.0% { transform: translate(428.0px, 139.7px) rotate(-17.5deg); }
      47.5% { transform: translate(450.8px, 131.2px) rotate(-22.9deg); }
      50.0% { transform: translate(472.5px, 121.5px) rotate(-24.7deg); }
      52.5% { transform: translate(494.2px, 111.8px) rotate(-22.9deg); }
      55.0% { transform: translate(517.0px, 103.3px) rotate(-17.5deg); }
      57.5% { transform: translate(541.9px, 97.3px) rotate(-9.4deg); }
      60.0% { transform: translate(570.0px, 95.0px) rotate(0.0deg); }
      62.5% { transform: translate(598.1px, 97.4px) rotate(10.1deg); }
      65.0% { transform: translate(623.0px, 103.9px) rotate(18.7deg); }
      67.5% { transform: translate(645.8px, 113.0px) rotate(24.4deg); }
      70.0% { transform: translate(667.5px, 123.5px) rotate(26.4deg); }
      72.5% { transform: translate(689.2px, 134.0px) rotate(24.4deg); }
      75.0% { transform: translate(712.0px, 143.1px) rotate(18.7deg); }
      77.5% { transform: translate(736.9px, 149.6px) rotate(10.1deg); }
      80.0% { transform: translate(765.0px, 152.0px) rotate(0.0deg); }
      82.5% { transform: translate(789.7px, 150.5px) rotate(-6.8deg); }
      85.0% { transform: translate(811.7px, 146.7px) rotate(-12.9deg); }
      87.5% { transform: translate(831.6px, 141.2px) rotate(-17.4deg); }
      90.0% { transform: translate(850.0px, 135.0px) rotate(-19.7deg); }
      92.5% { transform: translate(867.4px, 128.8px) rotate(-19.2deg); }
      95.0% { transform: translate(884.5px, 123.3px) rotate(-15.6deg); }
      97.5% { transform: translate(901.9px, 119.5px) rotate(-9.0deg); }
      100.0% { transform: translate(920.0px, 118.0px) rotate(0.0deg); }
    }

    .snake-part {
      animation: snake-crawl 8s linear infinite;
      transform-origin: 0 0;
    }
    .snake-head { animation-delay: 0s; }
    .seg-1  { animation-delay: -0.05s; }
    .seg-2  { animation-delay: -0.10s; }
    .seg-3  { animation-delay: -0.15s; }
    .seg-4  { animation-delay: -0.20s; }
    .seg-5  { animation-delay: -0.25s; }
    .seg-6  { animation-delay: -0.30s; }
    .seg-7  { animation-delay: -0.35s; }
    .seg-8  { animation-delay: -0.40s; }
    .seg-9  { animation-delay: -0.45s; }
    .seg-10 { animation-delay: -0.50s; }
    .seg-11 { animation-delay: -0.55s; }
    .seg-12 { animation-delay: -0.60s; }
    .seg-13 { animation-delay: -0.65s; }
    .seg-14 { animation-delay: -0.70s; }

    /* Text Pushing Animations (Synced to Snake Crawl) */
    @keyframes push-line1-cmd {
      0%, 14% { transform: translateY(0); }
      18% { transform: translateY(-16px); }
      22% { transform: translateY(-14px); }
      28% { transform: translateY(2px); }
      32%, 100% { transform: translateY(0); }
    }

    @keyframes push-line2-text {
      0%, 32% { transform: translateY(0); }
      37% { transform: translateY(18px); }
      41% { transform: translateY(16px); }
      46% { transform: translateY(-2px); }
      50%, 100% { transform: translateY(0); }
    }

    @keyframes push-line2-word-left {
      0%, 32% { transform: translate(0, 0); }
      37% { transform: translate(-14px, 8px); }
      41% { transform: translate(-12px, 6px); }
      46% { transform: translate(2px, -1px); }
      50%, 100% { transform: translate(0, 0); }
    }

    @keyframes push-line2-word-right {
      0%, 33% { transform: translate(0, 0); }
      38% { transform: translate(18px, -10px); }
      42% { transform: translate(16px, -8px); }
      47% { transform: translate(-2px, 1px); }
      51%, 100% { transform: translate(0, 0); }
    }

    @keyframes push-line3-skills {
      0%, 52% { transform: translateY(0); }
      57% { transform: translateY(-15px); }
      61% { transform: translateY(-12px); }
      67% { transform: translateY(2px); }
      72%, 100% { transform: translateY(0); }
    }

    @keyframes push-line4-bar {
      0%, 72% { transform: translateY(0) rotate(0deg); }
      77% { transform: translateY(16px) rotate(-1.5deg); }
      81% { transform: translateY(14px) rotate(-1deg); }
      87% { transform: translateY(-2px) rotate(0.5deg); }
      92%, 100% { transform: translateY(0) rotate(0deg); }
    }

    @keyframes tongue-flick {
      0%, 10%, 25%, 100% { transform: scaleX(0.2); opacity: 0.3; }
      15%, 20% { transform: scaleX(1); opacity: 1; }
    }

    .animated-cmd         { animation: push-line1-cmd 8s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
    .animated-badge-left  { animation: push-line2-word-left 8s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
    .animated-badge-right { animation: push-line2-word-right 8s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
    .animated-line2-text  { animation: push-line2-text 8s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
    .animated-skills      { animation: push-line3-skills 8s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
    .animated-bar         { animation: push-line4-bar 8s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
    .snake-tongue         { animation: tongue-flick 1.2s ease-in-out infinite; transform-origin: 0 0; }
  </style>

  <!-- Terminal Window Background -->
  <rect width="820" height="260" rx="12" fill="url(#term-bg)" stroke="#30363d" stroke-width="1.2"/>

  <!-- Terminal Window Header -->
  <path d="M 0,12 C 0,5.37 5.37,0 12,0 L 808,0 C 814.63,0 820,5.37 820,12 L 820,38 L 0,38 Z" fill="url(#header-grad)"/>
  <line x1="0" y1="38" x2="820" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Window Control Buttons (Mac Style) -->
  <circle cx="24" cy="19" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="44" cy="19" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="64" cy="19" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Terminal Window Title -->
  <text x="410" y="24" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8b949e">
    ⚡ major-ai-skills · autonomous agent playground (live snake crawl)
  </text>

  <!-- TERMINAL CONTENT & TEXT LINES -->

  <!-- LINE 1: Prompt Execution -->
  <g class="mono-text">
    <text x="28" y="75">
      <tspan class="text-green font-bold">➜</tspan>
      <tspan class="text-purple font-bold"> ~ </tspan>
      <tspan class="text-dim">npx major-ai-skills </tspan>
    </text>
    <g class="animated-cmd">
      <text x="202" y="75">
        <tspan class="text-cyan">--claude-code</tspan>
        <tspan class="text-dim"> --skills </tspan>
        <tspan class="text-yellow">vllm,temporal,nats,qdrant</tspan>
      </text>
    </g>
  </g>

  <!-- LINE 2: Catalog Status with Pushable Clearance -->
  <g class="mono-text">
    <text x="28" y="112">
      <tspan class="text-cyan">✔</tspan>
      <tspan class="text-dim"> Catalog: </tspan>
    </text>

    <!-- Word 1: pushes LEFT & DOWN to create entrance for snake -->
    <g class="animated-badge-left">
      <rect x="110" y="97" width="48" height="20" rx="4" fill="#1f2937" stroke="#388bfd" stroke-width="1"/>
      <text x="134" y="111" text-anchor="middle" class="text-cyan font-bold" font-size="11">412</text>
    </g>

    <!-- Word 2: pushes RIGHT & UP to widen the corridor for snake -->
    <g class="animated-badge-right">
      <text x="170" y="112" class="text-green font-bold">Canonical Skills</text>
    </g>

    <!-- Subtitle: drops down to give overhead passage space -->
    <g class="animated-line2-text">
      <text x="325" y="112">
        <tspan class="text-dim">| Zero-Latency Workflows · </tspan>
        <tspan class="text-orange font-bold">Token-Efficient</tspan>
      </text>
    </g>
  </g>

  <!-- LINE 3: Interactive Skills Stream (pushes UP when snake glides by) -->
  <g class="mono-text">
    <text x="28" y="148">
      <tspan class="text-purple">▶</tspan>
      <tspan class="text-dim"> New Additions: </tspan>
    </text>
    <g class="animated-skills">
      <text x="160" y="148">
        <tspan class="text-yellow font-bold">vllm</tspan>
        <tspan class="text-dim"> · </tspan>
        <tspan class="text-cyan font-bold">temporal</tspan>
        <tspan class="text-dim"> · </tspan>
        <tspan class="text-green font-bold">nats</tspan>
        <tspan class="text-dim"> · </tspan>
        <tspan class="text-purple font-bold">qdrant</tspan>
        <tspan class="text-dim"> · </tspan>
        <tspan class="text-orange font-bold">meilisearch</tspan>
        <tspan class="text-dim"> · </tspan>
        <tspan class="text-yellow font-bold">traefik</tspan>
        <tspan class="text-dim"> · </tspan>
        <tspan class="text-cyan font-bold">vitest</tspan>
        <tspan class="text-dim"> · </tspan>
        <tspan class="text-red font-bold">tauri</tspan>
      </text>
    </g>
  </g>

  <!-- LINE 4: Global CDN & Telemetry Banner (dips down when snake crosses) -->
  <g class="animated-bar">
    <rect x="28" y="172" width="764" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="42" y="189" class="mono-text" font-size="11">
      <tspan class="text-red font-bold">⚡</tspan>
      <tspan class="text-dim"> jsDelivr Global Edge CDN: </tspan>
      <tspan class="text-cyan font-bold">5,560+ Requests</tspan>
      <tspan class="text-dim"> | Instant Skills Delivery Worldwide | Zero Config</tspan>
    </text>
  </g>

  <!-- LINE 5: Active Terminal Status & Cursor -->
  <g class="mono-text">
    <text x="28" y="228">
      <tspan class="text-green">●</tspan>
      <tspan class="text-dim"> Ready for </tspan>
      <tspan class="text-yellow">Claude Code</tspan>
      <tspan class="text-dim"> · </tspan>
      <tspan class="text-orange">Cursor</tspan>
      <tspan class="text-dim"> · </tspan>
      <tspan class="text-cyan">Antigravity</tspan>
      <tspan class="text-dim"> · </tspan>
      <tspan class="text-purple">Gemini CLI</tspan>
      <tspan class="text-dim"> · </tspan>
      <tspan class="text-green">Codex CLI</tspan>
    </text>
    <rect x="670" y="216" width="8" height="15" fill="#58a6ff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- THE ANIMATED SNAKE: 14 articulated segments + head with eyes & tongue -->
  <g filter="url(#neon-glow)">
    <!-- Body segments (tail to neck) -->
    <g class="snake-part seg-14"><circle r="2.5" fill="url(#snake-body-grad)" opacity="0.18"/></g>
    <g class="snake-part seg-13"><circle r="3.0" fill="url(#snake-body-grad)" opacity="0.25"/></g>
    <g class="snake-part seg-12"><circle r="3.5" fill="url(#snake-body-grad)" opacity="0.32"/></g>
    <g class="snake-part seg-11"><circle r="4.0" fill="url(#snake-body-grad)" opacity="0.38"/></g>
    <g class="snake-part seg-10"><circle r="4.5" fill="url(#snake-body-grad)" opacity="0.44"/></g>
    <g class="snake-part seg-9"><circle r="5.0" fill="url(#snake-body-grad)" opacity="0.50"/></g>
    <g class="snake-part seg-8"><circle r="5.5" fill="url(#snake-body-grad)" opacity="0.56"/></g>
    <g class="snake-part seg-7"><circle r="6.0" fill="url(#snake-body-grad)" opacity="0.65"/></g>
    <g class="snake-part seg-6"><circle r="6.5" fill="url(#snake-body-grad)" opacity="0.74"/></g>
    <g class="snake-part seg-5"><circle r="7.0" fill="url(#snake-body-grad)" opacity="0.82"/></g>
    <g class="snake-part seg-4"><circle r="7.5" fill="url(#snake-body-grad)" opacity="0.90"/></g>
    <g class="snake-part seg-3"><circle r="8.0" fill="url(#snake-body-grad)" opacity="0.95"/></g>
    <g class="snake-part seg-2"><circle r="8.5" fill="url(#snake-body-grad)" opacity="0.98"/></g>
    <g class="snake-part seg-1"><circle r="9.0" fill="url(#snake-body-grad)" opacity="1.00"/></g>

    <!-- Snake Head with Eyes and Forked Tongue -->
    <g class="snake-part snake-head">
      <ellipse cx="0" cy="0" rx="10" ry="7.5" fill="url(#snake-head-grad)"/>
      <circle cx="3" cy="-3.5" r="2.2" fill="#0d1117"/>
      <circle cx="3.8" cy="-4" r="0.9" fill="#ffffff"/>
      <circle cx="3" cy="3.5" r="2.2" fill="#0d1117"/>
      <circle cx="3.8" cy="3" r="0.9" fill="#ffffff"/>
      <g class="snake-tongue" transform="translate(10, 0)">
        <path d="M 0,0 L 7,-2 M 0,0 L 7,2 M 0,0 L 4,0" stroke="#ff385c" stroke-width="1.2" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
